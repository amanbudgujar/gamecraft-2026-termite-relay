  <!-- Main Dirt Block -->
  <path d="M 0 22 C 40 20, 80 24, 120 20 C 160 22, 200 18, 240 22 L 240 70 C 230 78, 210 85, 190 75 C 170 65, 140 82, 110 74 C 80 66, 50 82, 20 76 L 0 68 Z" fill="url(#dirtGrad)" stroke="#1a0a04" stroke-width="3" />

