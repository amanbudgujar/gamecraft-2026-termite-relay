  <path d="M 30 42 Q 45 38 60 44 Q 50 54 30 42 Z" fill="#4d2411" stroke="#1a0a04" stroke-width="2" />
  <path d="M 140 48 Q 160 42 175 50 Q 160 62 140 48 Z" fill="#4d2411" stroke="#1a0a04" stroke-width="2" />
  <circle cx="100" cy="52" r="3.5" fill="#2d1307" />
  <circle cx="210" cy="45" r="4.5" fill="#2d1307" />

  <!-- Hanging Roots -->
  <path d="M 45 74 Q 42 84 38 88 M 115 74 Q 120 84 118 90 M 185 75 Q 182 82 188 87" fill="none" stroke="#4a2511" stroke-width="3" stroke-linecap="round" />

  <!-- Top Grass Surface Layer & Hanging Blades -->
