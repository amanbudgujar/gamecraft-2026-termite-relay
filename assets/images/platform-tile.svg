<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 90" width="240" height="90">
  <defs>
    <linearGradient id="dirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9e5d3b" />
      <stop offset="45%" stop-color="#6e3920" />
      <stop offset="100%" stop-color="#3b1a0b" />
    </linearGradient>

    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ede81" />
      <stop offset="60%" stop-color="#4e9942" />
      <stop offset="100%" stop-color="#2a5c23" />
    </linearGradient>
