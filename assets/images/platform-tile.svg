           C 10 10, 14 6, 18 20
           C 25 8, 32 4, 38 22
           C 48 12, 54 8, 60 20
           C 70 6, 78 10, 84 22
           C 95 8, 102 4, 108 20
           C 118 10, 126 6, 132 22
           C 142 8, 150 12, 156 20
           C 168 6, 174 10, 180 22
           C 190 8, 198 4, 204 20
           C 215 10, 222 6, 228 22
           C 234 14, 238 12, 240 22
           L 240 28 C 200 24, 160 28, 120 26 C 80 30, 40 24, 0 28 Z" fill="url(#grassGrad)" stroke="#12260e" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Grass Edge Rim Highlight -->
  <path d="M 2 20 Q 60 16 120 20 Q 180 15 238 20" fill="none" stroke="#bdf7b2" stroke-width="2" opacity="0.6" stroke-linecap="round" />
</svg>
