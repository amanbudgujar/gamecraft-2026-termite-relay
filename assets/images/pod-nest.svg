<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <radialGradient id="nestEntranceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe5cd" />
      <stop offset="35%" stop-color="#ff554f" />
      <stop offset="70%" stop-color="#b02520" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <radialGradient id="moundGrad" cx="40%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#df8253" />
      <stop offset="55%" stop-color="#a64e28" />
      <stop offset="100%" stop-color="#4a1c09" />
    </radialGradient>

    <linearGradient id="signWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b5774c" />
      <stop offset="100%" stop-color="#6e3e1d" />
    </linearGradient>
  </defs>

  <!-- Ambient Light Aura -->
  <circle cx="100" cy="85" r="75" fill="#ff4d4d" opacity="0.25" filter="blur(12px)" />

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="148" rx="85" ry="10" fill="#1f100b" opacity="0.4" />

  <!-- Main Dirt Mound Structure -->
  <path d="M 15 150 Q 25 65 75 35 Q 120 10 170 80 Q 188 115 185 150 Z" fill="url(#moundGrad)" stroke="#1c0903" stroke-width="3.5" />

  <!-- Organic Clay Ridges / Strata -->
  <path d="M 45 145 C 40 100, 58 65, 85 45" fill="none" stroke="#803819" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <path d="M 95 148 C 90 95, 110 50, 140 38" fill="none" stroke="#803819" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <path d="M 140 145 C 138 115, 152 90, 170 85" fill="none" stroke="#f0a378" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />

  <!-- Tunnel Entrance Chamber (Deep Archway) -->
  <path d="M 72 150 A 28 32 0 0 1 128 150 Z" fill="url(#nestEntranceGlow)" stroke="#1c0903" stroke-width="3.5" />
  <path d="M 76 150 A 24 26 0 0 1 124 150 Z" fill="#140603" opacity="0.85" />

  <!-- Wooden Signpost -->
  <!-- Pole -->
  <rect x="152" y="70" width="8" height="75" rx="3" fill="#422410" stroke="#1c0903" stroke-width="2" />
  <!-- Sign Board -->
  <g transform="rotate(-6 156 70)">
    <rect x="122" y="48" width="68" height="36" rx="6" fill="url(#signWood)" stroke="#1c0903" stroke-width="2.5" />
    <!-- Screws -->
    <circle cx="127" cy="53" r="1.5" fill="#30180a" />
    <circle cx="185" cy="53" r="1.5" fill="#30180a" />
    <circle cx="127" cy="79" r="1.5" fill="#30180a" />
    <circle cx="185" cy="79" r="1.5" fill="#30180a" />
    <!-- Sign Content: Arrow & Pod Icon -->
    <path d="M 132 66 L 142 58 L 142 63 L 152 63 L 152 69 L 142 69 L 142 74 Z" fill="#ffeaa5" stroke="#1c0903" stroke-width="1" />
    <!-- Mini Pod Icon -->
    <ellipse cx="168" cy="66" rx="6" ry="9" fill="#ff4d6d" stroke="#1c0903" stroke-width="1.5" transform="rotate(15 168 66)" />
    <ellipse cx="166" cy="63" rx="1.5" ry="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Surface Pebbles -->
  <circle cx="35" cy="142" r="4" fill="#69331b" stroke="#1c0903" stroke-width="1.5" />
  <circle cx="48" cy="148" r="2.5" fill="#522612" />
  <circle cx="178" cy="144" r="3.5" fill="#69331b" stroke="#1c0903" stroke-width="1.5" />
</svg>
