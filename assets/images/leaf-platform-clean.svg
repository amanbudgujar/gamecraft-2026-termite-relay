<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 85" width="260" height="85">
  <defs>
    <linearGradient id="topEdgeGlowClean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b4ff80" />
      <stop offset="50%" stop-color="#e2ffb3" />
      <stop offset="100%" stop-color="#8ce05a" />
    </linearGradient>

    <linearGradient id="leafGradClean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5bbd3a" />
      <stop offset="30%" stop-color="#348e21" />
      <stop offset="70%" stop-color="#1e5e11" />
      <stop offset="100%" stop-color="#0e3108" />
    </linearGradient>

    <linearGradient id="leafHighlightClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80e854" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#3fa630" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="stemGradClean" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c5e1b" />
      <stop offset="30%" stop-color="#93f069" />
      <stop offset="80%" stop-color="#55b035" />
      <stop offset="100%" stop-color="#245217" />
    </linearGradient>

    <filter id="leafShadowClean" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#051204" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <path d="M 18 32 Q 130 78 245 34 Q 130 90 18 32 Z" fill="#040d03" opacity="0.4" />

  <!-- Base Attachment Stem -->
  <path d="M -8 42 C 6 38, 16 46, 26 40 C 32 36, 20 28, 6 30 C -4 31, -8 38, -8 42 Z" fill="#2d661c" stroke="#0a1a06" stroke-width="2" />
  <path d="M -8 42 C 8 38, 18 45, 30 38" fill="none" stroke="#66cb40" stroke-width="1.5" stroke-linecap="round" />

  <!-- Main Leaf Body -->
  <path d="M 12 30 
           C 48 21, 105 19, 165 21 
           C 202 22, 234 26, 252 34 
           C 236 50, 195 69, 135 71 
           C 75 73, 35 60, 12 30 Z" 
        fill="url(#leafGradClean)" stroke="#0a1a06" stroke-width="3" stroke-linejoin="round" filter="url(#leafShadowClean)" />

  <!-- Light Surface Overlay -->
  <path d="M 15 31 C 52 23, 108 21, 162 22 C 200 23, 228 27, 246 34 C 208 41, 138 43, 15 31 Z" fill="url(#leafHighlightClean)" />

  <!-- Under-Belly Depth Contour -->
  <path d="M 28 42 C 75 62, 145 65, 235 42 C 180 62, 100 62, 28 42 Z" fill="#071705" opacity="0.6" />

  <!-- Central Spine -->
  <path d="M 8 34 C 62 36, 132 38, 246 35" fill="none" stroke="url(#stemGradClean)" stroke-width="4" stroke-linecap="round" />

  <!-- Upper Lateral Veins -->
  <path d="M 40 31 Q 52 23 66 22" fill="none" stroke="#a2f57a" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 82 32 Q 98 23 116 22" fill="none" stroke="#a2f57a" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 132 33 Q 150 24 170 23" fill="none" stroke="#a2f57a" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 182 34 Q 200 27 216 27" fill="none" stroke="#a2f57a" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Lower Lateral Veins -->
  <path d="M 46 35 Q 62 47 78 53" fill="none" stroke="#266917" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <path d="M 94 36 Q 114 51 134 57" fill="none" stroke="#266917" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <path d="M 144 37 Q 164 49 184 53" fill="none" stroke="#266917" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <path d="M 192 36 Q 208 45 222 47" fill="none" stroke="#266917" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Top Landing Collision Line -->
  <path d="M 14 29 C 50 21, 105 19, 160 20 C 198 21, 230 25, 250 33" 
        fill="none" stroke="url(#topEdgeGlowClean)" stroke-width="3" stroke-linecap="round" />

  <!-- Scalloped Edge Cutouts -->
  <path d="M 78 20 C 80 24, 84 24, 86 20 Z" fill="#0e3108" opacity="0.9" />
  <path d="M 145 21 C 147 25, 151 25, 153 21 Z" fill="#0e3108" opacity="0.9" />
</svg>
