<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 85" width="260" height="85">
  <defs>
    <linearGradient id="topEdgeGlowAlt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b4ff80" />
      <stop offset="50%" stop-color="#e2ffb3" />
      <stop offset="100%" stop-color="#8ce05a" />
    </linearGradient>

    <linearGradient id="leafGradAlt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5bbd3a" />
      <stop offset="30%" stop-color="#348e21" />
      <stop offset="70%" stop-color="#1e5e11" />
      <stop offset="100%" stop-color="#0e3108" />
    </linearGradient>

    <linearGradient id="leafHighlightAlt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80e854" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#3fa630" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="stemGradAlt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2c5e1b" />
      <stop offset="30%" stop-color="#93f069" />
      <stop offset="80%" stop-color="#55b035" />
      <stop offset="100%" stop-color="#245217" />
    </linearGradient>

    <radialGradient id="dewGradAlt" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#c1f3ff" />
      <stop offset="70%" stop-color="#38a3cf" />
      <stop offset="100%" stop-color="#13526d" />
    </radialGradient>

    <filter id="leafShadowAlt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#051204" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Ambient Ground Shadow -->
  <path d="M 18 32 Q 130 78 245 34 Q 130 90 18 32 Z" fill="#040d03" opacity="0.4" />

  <!-- Base Stem -->
  <path d="M -8 38 C 8 34, 18 46, 28 40 C 34 36, 22 28, 8 30 C -2 31, -8 36, -8 38 Z" fill="#2d661c" stroke="#0a1a06" stroke-width="2" />
  <path d="M -8 38 C 10 35, 20 44, 32 38" fill="none" stroke="#66cb40" stroke-width="1.5" stroke-linecap="round" />

  <!-- Main Leaf Body -->
  <path d="M 12 30 
           C 45 22, 100 20, 160 21 
           C 200 22, 232 26, 252 34 
           C 238 48, 200 68, 140 72 
           C 80 76, 38 62, 12 30 Z" 
        fill="url(#leafGradAlt)" stroke="#0a1a06" stroke-width="3" stroke-linejoin="round" filter="url(#leafShadowAlt)" />

  <!-- Light Surface Overlay -->
  <path d="M 15 31 C 50 24, 105 22, 160 23 C 198 24, 228 28, 246 34 C 210 42, 140 44, 15 31 Z" fill="url(#leafHighlightAlt)" />

  <!-- Under-Belly Depth Contour -->
  <path d="M 28 42 C 75 62, 145 65, 235 42 C 180 62, 100 62, 28 42 Z" fill="#071705" opacity="0.6" />

  <!-- Central Spine -->
  <path d="M 8 34 C 60 36, 130 38, 246 35" fill="none" stroke="url(#stemGradAlt)" stroke-width="4" stroke-linecap="round" />

  <!-- Upper Lateral Veins -->
  <path d="M 45 32 Q 58 25 72 24" fill="none" stroke="#a2f57a" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 90 33 Q 106 24 124 23" fill="none" stroke="#a2f57a" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 140 34 Q 158 25 178 24" fill="none" stroke="#a2f57a" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  <path d="M 190 35 Q 206 28 222 28" fill="none" stroke="#a2f57a" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />

  <!-- Lower Lateral Veins -->
  <path d="M 50 36 Q 66 48 82 54" fill="none" stroke="#266917" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <path d="M 100 37 Q 120 52 140 58" fill="none" stroke="#266917" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <path d="M 150 37 Q 170 50 190 54" fill="none" stroke="#266917" stroke-width="2.2" stroke-linecap="round" opacity="0.8" />
  <path d="M 198 36 Q 212 46 226 48" fill="none" stroke="#266917" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Top Landing Collision Line -->
  <path d="M 14 29 C 50 21, 105 19, 160 20 C 198 21, 230 25, 250 33" 
        fill="none" stroke="url(#topEdgeGlowAlt)" stroke-width="3" stroke-linecap="round" />

  <!-- Scalloped Edge Cutouts -->
  <path d="M 102 21 C 104 25, 108 25, 110 21 Z" fill="#0e3108" opacity="0.9" />
  <path d="M 210 27 C 212 31, 216 31, 218 27 Z" fill="#0e3108" opacity="0.9" />

  <!-- Variable Dew Droplets (Large Left Droplet + Tip Cluster + Hanging Under-Drop) -->
  <g>
    <!-- Big Droplet on Left Surface -->
    <ellipse cx="48" cy="28" rx="7.5" ry="5" fill="url(#dewGradAlt)" stroke="#114254" stroke-width="0.8" />
    <ellipse cx="46" cy="26" rx="2.5" ry="1.2" fill="#ffffff" opacity="0.9" />

    <!-- Tiny Droplet Pair on Right Tip -->
    <circle cx="198" cy="26" r="3.2" fill="url(#dewGradAlt)" stroke="#114254" stroke-width="0.6" />
    <circle cx="197" cy="25" r="1" fill="#ffffff" opacity="0.9" />
    
    <circle cx="205" cy="27" r="2.2" fill="url(#dewGradAlt)" stroke="#114254" stroke-width="0.5" />
    <circle cx="204.5" cy="26.3" r="0.7" fill="#ffffff" opacity="0.9" />

    <!-- Hanging Droplet Dripping Off Bottom Edge -->
    <path d="M 132 68 C 130 72, 131 77, 135 77 C 139 77, 140 72, 138 68 Z" fill="url(#dewGradAlt)" stroke="#114254" stroke-width="0.6" />
    <circle cx="134" cy="74" r="1" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
